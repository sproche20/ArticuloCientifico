spring.application.name=restgraphqlmigration
# Configuración de la base de datos PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/rest_api_graphql_api_db
spring.datasource.username=user_admin
spring.datasource.password=password123
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA y Hibernate (mantener update si las tablas ya existen o se crean por otro medio)
spring.jpa.hibernate.ddl-auto=create
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Optimización para Carga Masiva (Data Seeding)
# Agrupa los inserts en paquetes de 50 para reducir viajes a la DB
spring.jpa.properties.hibernate.jdbc.batch_size=50
# Ordena los inserts para que el batching funcione correctamente con colecciones
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Puerto nuevo para evitar el error "In Use"
server.port=8081